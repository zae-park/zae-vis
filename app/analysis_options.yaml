analyzer:
  # Generated output and the platform folders tool/setup_platforms.sh creates (none are tracked, none hold Dart).
  # Flutter 3.47's tool adds the ones present on each machine on every pub get; listing all of them keeps it quiet.
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - use_build_context_synchronously
