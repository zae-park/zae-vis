name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu and macOS. Windows npm test never returns (a child stays open), so that OS is
  # covered by the desktop build below instead of holding a runner for hours.
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: zaevis launcher smoke (help, doctor)
        shell: bash
        run: |
          cd ..
          bin/zaevis help
          ZAEVIS_HOME=$RUNNER_TEMP/zv node server/src/zaevis.ts doctor || true

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: web build
        run: |
          tool/setup_platforms.sh web
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web

  # Desktop builds: proves the runners compile with the plugins (record, hotkey, window) on each OS.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            out: app/build/macos/Build/Products/Release/zaevis.app
          - os: windows-latest
            platform: windows
            out: app/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: runner folder
        shell: bash
        run: tool/setup_platforms.sh ${{ matrix.platform }}
      - run: flutter build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: ${{ matrix.out }}

  # Every main push rebuilds installers for the pubspec version and replaces that Release.
  release-needed:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: read pubspec version
        id: check
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          if ! [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "pubspec version is not x.y.z: ${ver:-empty}" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "will publish v$ver"

  # Full installers (Node runtime + MinSync + server + app).
  package:
    needs: release-needed
    if: needs.release-needed.outputs.needed == 'true'
    env:
      ZAEVIS_BUILD: ${{ needs.release-needed.outputs.build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: tool/package_macos.sh
            artifact: dist/*.dmg
          - os: windows-latest
            script: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/package_windows.ps1
            artifact: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: build tools (protobuf, cmake)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install protobuf cmake; else choco install -y protoc cmake --no-progress; fi
      - uses: actions/cache@v4
        with:
          path: |
            build/package/cache/minsync
            build/package-win/cache/minsync
          key: minsync-${{ runner.os }}-0.5.0
      - run: ${{ matrix.script }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: [release-needed, package]
    if: needs.package.result == 'success' && needs.release-needed.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: drop previous release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.release-needed.outputs.version }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${TAG}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release-needed.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            version: ${{ needs.release-needed.outputs.version }}+${{ needs.release-needed.outputs.build }}
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
      - name: delete installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("installer-")) | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done
