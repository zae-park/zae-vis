name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu and macOS. Windows npm test never returns (a child stays open), so that OS is
  # covered by the desktop build below instead of holding a runner for hours.
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-fund --no-audit
      - run: npm test
      - name: zaevis launcher smoke (help, doctor)
        shell: bash
        run: |
          cd ..
          bin/zaevis help
          ZAEVIS_HOME=$RUNNER_TEMP/zv node server/src/zaevis.ts doctor || true

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: web build
        run: |
          tool/setup_platforms.sh web
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web

  # Desktop builds: proves the runners compile with the plugins (record, hotkey, window) on each OS.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            out: app/build/macos/Build/Products/Release/zaevis.app
          - os: windows-latest
            platform: windows
            out: app/build/windows/x64/runner/Release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: runner folder
        shell: bash
        run: tool/setup_platforms.sh ${{ matrix.platform }}
      - run: flutter build ${{ matrix.platform }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: ${{ matrix.out }}

  # Full installers (Node runtime + MinSync + server + app).
  # A vX.Y.Z tag publishes them on the Release page; a manual run only keeps short-lived artifacts.
  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: tool/package_macos.sh
            artifact: dist/*.dmg
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File tool/package_windows.ps1
            artifact: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          ver=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "tag v$tag does not match pubspec version $ver" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: build tools (protobuf, cmake)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install protobuf cmake; else choco install -y protoc cmake --no-progress; fi
      - uses: actions/cache@v4
        with:
          path: |
            build/package/cache/minsync
            build/package-win/cache/minsync
          key: minsync-${{ runner.os }}-0.5.0
      - run: ${{ matrix.script }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: delete installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("installer-")) | .id' \
          | while read -r id; do
              [ -n "$id" ] || continue
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
            done
